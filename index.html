<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سيارتي شانجان CS85 limited</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --font-ar: 'Tajawal', sans-serif;
            --font-en: 'Poppins', sans-serif;
            --bg-light: url('https://images.unsplash.com/photo-1511919884226-fd3cad34687c?q=80&w=2940&auto=format&fit=crop');
            --bg-dark: url('https://images.unsplash.com/photo-1533106418989-88981c693175?q=80&w=2832&auto=format&fit=crop');
            --text-light: #1f2937;
            --card-bg-light: rgba(255, 255, 255, 0.8);
            --border-light: #e5e7eb;
            --text-dark: #d1d5db;
            --card-bg-dark: rgba(31, 41, 55, 0.8);
            --border-dark: #374151;
            --primary-500: #3b82f6;
            --primary-600: #2563eb;
        }
        html.dark { color-scheme: dark; }
        body {
            font-family: var(--font-ar);
            background-image: var(--bg-light);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: var(--text-light);
            transition: background-image 0.5s, color 0.3s;
        }
        html.dark body {
            background-image: var(--bg-dark);
            color: var(--text-dark);
        }
        html[lang="en"] body { font-family: var(--font-en); }
        .controls-header {
            background-color: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-light);
        }
        html.dark .controls-header {
            background-color: rgba(17, 24, 39, 0.6);
            border-bottom-color: var(--border-dark);
        }
        .nav-button.active {
            background-color: var(--primary-600);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        html.dark .nav-button.active {
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.2);
        }
        .main-content-card, .feature-card, .dashboard-card {
            background-color: var(--card-bg-light);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-light);
            transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s;
        }
        .feature-card, .dashboard-card {
            opacity: 0;
            transform: translateY(20px);
        }
        html.dark .main-content-card, html.dark .feature-card, html.dark .dashboard-card {
            background-color: var(--card-bg-dark);
            border-color: var(--border-dark);
        }
        .feature-card.is-visible, .dashboard-card.is-visible {
            opacity: 1;
            transform: translateY(0);
        }
        .feature-card:hover, .dashboard-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        html.dark .feature-card:hover, html.dark .dashboard-card:hover {
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .modal-backdrop {
            transition: opacity 0.3s ease-in-out;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .modal-content {
            background-color: var(--card-bg-light);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
        }
        html.dark .modal-content { background-color: var(--card-bg-dark); }
        .modal-backdrop.open .modal-content {
            transform: translateY(0);
            opacity: 1;
        }
        .locked-card { filter: grayscale(80%); opacity: 0.6; }
        .user-message { background-color: #DBEAFE; color: #1e40af; }
        .ai-message { background-color: #E5E7EB; color: #1f2937; }
        html.dark .user-message { background-color: #1e3a8a; color: #dbeafe; }
        html.dark .ai-message { background-color: #374151; color: #d1d5db; }
        .form-input, .form-select, .form-textarea {
            background-color: rgba(249, 250, 251, 0.8);
            border-color: #d1d5db;
        }
        html.dark .form-input, html.dark .form-select, html.dark .form-textarea {
            background-color: rgba(55, 65, 81, 0.8);
            border-color: #4b5563;
            color: #d1d5db;
        }
        .btn-gradient {
            background-image: linear-gradient(to right, #3b82f6, #60a5fa);
            transition: all 0.3s ease;
        }
        .btn-gradient:hover {
            background-image: linear-gradient(to right, #2563eb, #3b82f6);
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }
        .ai-loader span, .scan-loader span, .gemini-loader span, .app-loader div {
            animation: bounce 1.4s infinite ease-in-out both;
            display: inline-block;
            width: 12px; height: 12px;
            background-color: #9ca3af;
            border-radius: 100%;
        }
        .ai-loader span:nth-child(1), .scan-loader span:nth-child(1), .gemini-loader span:nth-child(1), .app-loader div:nth-child(1) { animation-delay: -0.32s; }
        .ai-loader span:nth-child(2), .scan-loader span:nth-child(2), .gemini-loader span:nth-child(2), .app-loader div:nth-child(2) { animation-delay: -0.16s; }
        @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }
        #camera-view {
            background: #333;
            border: 4px dashed #555;
            position: relative;
            overflow: hidden;
        }
        #scan-line {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #05f, transparent);
            box-shadow: 0 0 10px #05f, 0 0 20px #05f;
            animation: scan 2s infinite linear;
            opacity: 0;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        .part-card-icon {
            transition: transform 0.2s, color 0.2s;
        }
        .part-card-icon:hover {
            transform: scale(1.2);
        }
        .part-card-icon.active {
            color: #ef4444; /* red-500 */
        }
        html.dark .part-card-icon.active {
            color: #f87171; /* red-400 */
        }
        .part-card-icon.cart.active {
            color: #3b82f6; /* blue-500 */
        }
        html.dark .part-card-icon.cart.active {
            color: #60a5fa; /* blue-400 */
        }
        .map-placeholder {
            background-color: #e0e0e0;
            background-image:
                linear-gradient(45deg, #c0c0c0 25%, transparent 25%),
                linear-gradient(-45deg, #c0c0c0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #c0c0c0 75%),
                linear-gradient(-45deg, transparent 75%, #c0c0c0 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        .star-rating {
            display: inline-flex;
            flex-direction: row-reverse;
            font-size: 1.5rem;
        }
        .star-rating input {
            display: none;
        }
        .star-rating label {
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s;
        }
        .star-rating input:checked ~ label,
        .star-rating label:hover,
        .star-rating label:hover ~ label {
            color: #fbbf24; /* yellow-400 */
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 dark:text-gray-300">
    <!-- App Loader -->
    <div id="app-loader" class="fixed inset-0 bg-gray-100 dark:bg-gray-900 z-50 flex flex-col items-center justify-center">
        <div class="flex gap-2"><div></div><div></div><div></div></div>
        <p class="mt-4 text-lg font-semibold text-gray-600 dark:text-gray-400" data-lang-key="app_loading">جاري تحميل التطبيق...</p>
    </div>

    <!-- Main App Content -->
    <div id="app-content" class="hidden">
        <!-- Header Controls -->
        <div class="sticky top-0 z-40 controls-header">
            <div class="container mx-auto px-4 sm:px-6 md:px-8 flex justify-between items-center h-16">
                <div class="flex gap-2 sm:gap-4 items-center" id="controls-container">
                    <div class="relative">
                        <select id="currency-switcher" class="form-select w-20 sm:w-24 text-sm sm:text-base bg-white/50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 font-semibold py-2 px-3 rounded-lg shadow-sm appearance-none focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="SAR">SAR</option>
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                        </select>
                    </div>
                    <button id="lang-switcher" class="bg-white/50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 font-semibold py-2 px-3 sm:px-4 rounded-lg shadow-sm text-sm sm:text-base"></button>
                    <button id="theme-toggle" class="p-2 rounded-lg bg-white/50 dark:bg-gray-700/50 border border-gray-300 dark:border-gray-600 shadow-sm">
                        <svg id="theme-icon-light" class="h-5 w-5 text-gray-800" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                        <svg id="theme-icon-dark" class="h-5 w-5 text-gray-200 hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                    </button>
                </div>
                <div id="auth-container"></div>
            </div>
        </div>

        <div class="container mx-auto p-4 sm:p-6 md:p-8">
            <header class="text-center my-10 relative">
                <h1 data-lang-key="main_title" class="text-3xl md:text-5xl font-extrabold text-blue-600 dark:text-blue-400 mb-2"></h1>
                <p data-lang-key="subtitle" id="header-subtitle" class="text-lg md:text-xl text-gray-600 dark:text-gray-400 max-w-3xl mx-auto"></p>
            </header>

            <main>
                <!-- Dashboard Section -->
                <section id="dashboard" class="mb-12">
                     <h2 data-lang-key="dashboard_title" class="text-2xl md:text-3xl font-bold text-center mb-6"></h2>
                     <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                         <div data-modal-target="parts-browser-modal" class="open-modal-btn dashboard-card rounded-xl shadow-lg p-6 flex flex-col items-center justify-center text-center cursor-pointer">
                             <svg class="h-12 w-12 text-blue-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.657 7.343A8 8 0 0117.657 18.657z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.522 16.022a4 4 0 10-5.656-5.656 4 4 0 005.656 5.656z"></path></svg>
                             <span class="text-3xl font-bold" id="db-parts-count">0</span>
                             <span class="text-gray-500 dark:text-gray-400 mt-1" data-lang-key="db_parts_label"></span>
                         </div>
                         <div data-modal-target="maintenance-log-modal" class="open-modal-btn dashboard-card rounded-xl shadow-lg p-6 flex flex-col items-center justify-center text-center cursor-pointer">
                             <svg class="h-12 w-12 text-green-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                             <span class="text-3xl font-bold" id="db-logs-count">0</span>
                             <span class="text-gray-500 dark:text-gray-400 mt-1" data-lang-key="db_logs_label"></span>
                         </div>
                         <div class="dashboard-card rounded-xl shadow-lg p-6 flex flex-col items-center justify-center text-center">
                             <svg class="h-12 w-12 text-red-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                             <span class="text-3xl font-bold" id="db-prediction">...</span>
                             <span class="text-gray-500 dark:text-gray-400 mt-1" data-lang-key="db_prediction_label"></span>
                         </div>
                         <div class="dashboard-card rounded-xl shadow-lg p-6 flex flex-col items-center justify-center text-center">
                             <svg class="h-12 w-12 text-indigo-500 mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 14l9-5-9-5-9 5 9 5z"></path><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"></path><path d="M12 14l9-5-9-5-9 5 9 5zm0 0v3.422a12.083 12.083 0 01-6.16-3.422L12 14z"></path></svg>
                             <span class="text-3xl font-bold" id="db-tire-health">92%</span>
                             <span class="text-gray-500 dark:text-gray-400 mt-1" data-lang-key="db_tire_health_label"></span>
                         </div>
                     </div>
                     <div id="elias-daily-tip" class="dashboard-card rounded-xl shadow-lg p-6 mt-6 text-center"></div>
                </section>

                <!-- Navigation Tabs -->
                <nav class="flex flex-wrap gap-2 md:gap-4 mb-10 items-center justify-center">
                    <button data-target="infrastructure" data-lang-key="nav_infrastructure" class="nav-button p-3 md:p-4 rounded-lg font-bold text-base md:text-lg shadow-md bg-white/50 dark:bg-gray-800/50 hover:bg-blue-50 dark:hover:bg-gray-700 transition-all duration-300 active"></button>
                    <button data-target="ux" data-lang-key="nav_ux" class="nav-button p-3 md:p-4 rounded-lg font-bold text-base md:text-lg shadow-md bg-white/50 dark:bg-gray-800/50 hover:bg-blue-50 dark:hover:bg-gray-700 transition-all duration-300"></button>
                    <button data-target="community" data-lang-key="nav_community" class="nav-button p-3 md:p-4 rounded-lg font-bold text-base md:text-lg shadow-md bg-white/50 dark:bg-gray-800/50 hover:bg-blue-50 dark:hover:bg-gray-700 transition-all duration-300"></button>
                    <button data-target="ai" data-lang-key="nav_ai" class="nav-button p-3 md:p-4 rounded-lg font-bold text-base md:text-lg shadow-md bg-white/50 dark:bg-gray-800/50 hover:bg-blue-50 dark:hover:bg-gray-700 transition-all duration-300"></button>
                    <div class="w-full md:w-auto flex justify-center gap-2 md:gap-4 mt-2 md:mt-0">
                        <button data-modal-target="favorites-modal" id="favorites-btn" class="open-modal-btn p-3 md:p-4 rounded-lg font-bold text-base md:text-lg shadow-md bg-white/50 dark:bg-gray-800/50 hover:bg-red-50 dark:hover:bg-gray-700 transition-all duration-300 flex items-center gap-2"></button>
                        <button data-modal-target="shopping-list-modal" id="shopping-list-btn" class="open-modal-btn p-3 md:p-4 rounded-lg font-bold text-base md:text-lg shadow-md bg-white/50 dark:bg-gray-800/50 hover:bg-green-50 dark:hover:bg-gray-700 transition-all duration-300 flex items-center gap-2"></button>
                    </div>
                </nav>

                <!-- Dynamic Content Container -->
                <div id="content-container"></div>
            </main>

            <footer class="text-center mt-12 pt-8 border-t border-gray-200/50 dark:border-gray-700/50">
                <p data-lang-key="footer_text" class="text-gray-600 dark:text-gray-400"></p>
            </footer>
        </div>
    </div>

    <!-- MODALS -->
    <!-- Login Modal -->
    <div id="login-modal" class="modal-backdrop fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden opacity-0 z-50">
        <div class="modal-content w-full max-w-sm rounded-2xl shadow-2xl p-6 md:p-8 transform -translate-y-full opacity-0">
            <div class="flex justify-between items-center mb-6">
                <h2 data-lang-key="login_modal_title" class="text-2xl font-bold text-blue-600 dark:text-blue-400"></h2>
                <button data-close-modal class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 text-3xl">&times;</button>
            </div>
            <div id="login-options">
                 <div class="flex border-b-2 border-gray-200 dark:border-gray-700 mb-4"><button id="email-login-tab" class="flex-1 p-2 font-semibold border-b-2 border-blue-500 text-blue-500" data-lang-key="login_email_tab"></button><button id="phone-login-tab" class="flex-1 p-2 font-semibold text-gray-500" data-lang-key="login_phone_tab"></button></div>
                <form id="email-login-form" class="space-y-4">
                    <div><label for="username" data-lang-key="username_label" class="block mb-1 font-semibold"></label><input type="email" id="username" required class="form-input w-full p-2 border rounded-lg"></div>
                    <div><label for="password" data-lang-key="password_label" class="block mb-1 font-semibold"></label><input type="password" id="password" required class="form-input w-full p-2 border rounded-lg"></div>
                    <p id="login-error" class="text-red-500 text-sm h-4"></p>
                    <button type="submit" data-lang-key="login_btn_modal" class="w-full text-white font-bold py-3 px-4 rounded-lg transition-all duration-300 btn-gradient"></button>
                </form>
                 <form id="phone-login-form" class="space-y-4 hidden">
                     <div><label for="phone" data-lang-key="phone_label" class="block mb-1 font-semibold"></label><input type="tel" id="phone" required class="form-input w-full p-2 border rounded-lg"></div>
                     <button type="submit" data-lang-key="send_code_btn" class="w-full text-white font-bold py-3 px-4 rounded-lg transition-all duration-300 btn-gradient"></button>
                 </form>
                <div class="my-4 text-center text-gray-500" data-lang-key="or_divider"></div>
                <button id="google-signin-btn" class="w-full bg-white dark:bg-gray-800 border border-gray-300 dark:border-gray-600 text-gray-700 dark:text-gray-200 font-semibold py-2 px-4 rounded-lg flex items-center justify-center gap-2 hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors">
                    <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path><path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"></path><path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"></path><path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l6.19,5.238C43.021,36.251,44,30.45,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path></svg>
                    <span data-lang-key="google_signin_btn"></span>
                </button>
            </div>
        </div>
    </div>

    <!-- Parts Browser Modal -->
    <div id="parts-browser-modal" class="modal-backdrop fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden opacity-0 z-50">
        <div class="modal-content w-full max-w-4xl h-5/6 rounded-2xl shadow-2xl p-6 md:p-8 transform -translate-y-full opacity-0 flex flex-col">
            <div class="flex justify-between items-center mb-6 flex-shrink-0">
                <h2 data-lang-key="parts_modal_title" class="text-2xl font-bold text-blue-600 dark:text-blue-400"></h2>
                <button data-close-modal class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 text-3xl">&times;</button>
            </div>
            <div class="mb-4 flex-shrink-0">
                <input type="text" id="parts-search" data-lang-key-placeholder="parts_search_placeholder" class="form-input w-full p-2 border rounded-lg" />
            </div>
            <div id="parts-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 overflow-y-auto p-2">
                <!-- Part cards will be injected here -->
            </div>
        </div>
    </div>

    <!-- Maintenance Log Modal -->
    <div id="maintenance-log-modal" class="modal-backdrop fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 hidden opacity-0 z-50">
         <div class="modal-content w-full max-w-2xl h-5/6 rounded-2xl shadow-2xl p-6 md:p-8 transform -translate-y-full opacity-0 flex flex-col">
            <div class="flex justify-between items-center mb-6 flex-shrink-0">
                <h2 data-lang-key="maint_modal_title" class="text-2xl font-bold text-blue-600 dark:text-blue-400"></h2>
                <button data-close-modal class="text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 text-3xl">&times;</button>
            </div>
            <div id="maintenance-list" class="flex-grow overflow-y-auto mb-4 space-y-3"></div>
            <div class="flex-shrink-0 border-t pt-4 dark:border-gray-600">
                 <h3 data-lang-key="add_maint_log_title" class="text-lg font-semibold mb-2"></h3>
                 <form id="add-log-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                     <input type="text" id="log-type" required class="form-input p-2 border rounded-lg" data-lang-key-placeholder="maint_type_placeholder">

        async function initFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);

                onAuthStateChanged(auth, async (user) => {
                    if (user) {
                        userId = user.uid;
                        updateAuthUI(user);
                        await loadUserData();

                        updateAuthUI(null);

                            await signInWithCustomToken(auth, __initial_auth_token).catch(console.error);

                           await signInAnonymously(auth).then(anonUser => userId = anonUser.user.uid).catch(console.error);
                        }
                    }
                    document.getElementById('app-loader').classList.add('hidden');
                    document.getElementById('app-content').classList.remove('hidden');
                    animateDashboardCards();

            } catch (error) {
                console.error("Firebase initialization failed:", error);
                 document.getElementById('app-loader').textContent = "Failed to load application.";

        function setupEventListeners() {
            document.getElementById('theme-toggle').addEventListener('click', toggleTheme);

                renderShoppingList();
                renderPartsBrowser();

                button.addEventListener('click', () => {
                    const modalId = button.dataset.modalTarget;

                    if(modalId === 'maintenance-log-modal') renderMaintenanceLogs();
                    if(modalId === 'favorites-modal') renderFavorites();
                    if(modalId === 'shopping-list-modal') renderShoppingList();
                    openModal(modalId);
                });
            });

            document.querySelectorAll('[data-close-modal]').forEach(button => {
                button.addEventListener('click', () => {
                    const modal = button.closest('.modal-backdrop');
                    if (modal) closeModal(modal.id);

            document.addEventListener('keydown', (event) => { if (event.key === "Escape") { document.querySelectorAll('.modal-backdrop.open').forEach(modal => closeModal(modal.id)); } });

        function updateThemeIcons(isDark) { document.getElementById('theme-icon-light').classList.toggle('hidden', isDark); document.getElementById('theme-icon-dark').classList.toggle('hidden', !isDark); }

        function getCommunityHTML() { return `<div class="main-content-card rounded-xl shadow-lg p-8 text-center"><h2 class="text-3xl font-bold mb-4">Community Hub</h2><p class="text-lg">Coming soon: Owner forums, reviews, and local meet-up information.</p></div>`; }
        function getAIHTML() { return `<div class="main-content-card rounded-xl shadow-lg p-2 sm:p-4 md:p-6 flex flex-col h-[70vh]"><div id="chat-messages" class="flex-1 overflow-y-auto p-4 space-y-4"></div><div class="mt-4 p-2 border-t dark:border-gray-600"><form id="chat-form" class="flex gap-2"><input type="text" id="chat-input" class="form-input flex-1 p-3 rounded-lg" data-lang-key-placeholder="ai_placeholder"><button type="submit" class="btn-gradient text-white font-bold py-3 px-5 rounded-lg"><svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"></path></svg></button></form></div></div>`; }

        function renderPartsBrowser(searchTerm = '') { const grid = document.getElementById('parts-grid'); grid.innerHTML = ''; const lowerSearchTerm = searchTerm.toLowerCase(); state.carParts.filter(part => part.name.en.toLowerCase().includes(lowerSearchTerm) || part.name.ar.toLowerCase().includes(lowerSearchTerm)).forEach(part => { const isFav = state.favorites.includes(part.id); const inCart = state.shoppingList.includes(part.id); grid.innerHTML += `<div class="feature-card rounded-lg p-4 flex flex-col text-center items-center is-visible"> <img src="${part.img}" alt="${part.name[currentLang]}" class="w-full h-32 object-cover rounded-md mb-3"> <h3 class="font-bold text-lg">${part.name[currentLang]}</h3> <p class="text-blue-600 dark:text-blue-400 font-semibold my-2">${formatPrice(part.price)}</p> <div class="flex gap-4 mt-auto"> <button data-part-id="${part.id}" class="toggle-fav-btn part-card-icon ${isFav ? 'active' : ''}"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 016.364 0L12 7.636l1.318-1.318a4.5 4.5 0 116.364 6.364L12 20.364l-7.682-7.682a4.5 4.5 0 010-6.364z"></path></svg></button> <button data-part-id="${part.id}" class="toggle-cart-btn part-card-icon cart ${inCart ? 'active' : ''}"><svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg></button> </div> </div>`; }); document.querySelectorAll('.toggle-fav-btn').forEach(b => b.onclick = (e) => toggleFavorite(e.currentTarget.dataset.partId)); document.querySelectorAll('.toggle-cart-btn').forEach(b => b.onclick = (e) => toggleCart(e.currentTarget.dataset.partId)); }
        function renderFavorites() { const list = document.getElementById('favorites-list'); list.innerHTML = !state.favorites.length ? `<p class="text-center text-gray-500">${currentLang === 'ar' ? 'لا يوجد شيء في المفضلة بعد.' : 'Nothing in favorites yet.'}</p>` : state.favorites.map(partId => { const part = state.carParts.find(p => p.id === partId); return `<div class="flex justify-between items-center bg-gray-100 dark:bg-gray-700 p-3 rounded-lg"><span>${part.name[currentLang]}</span><button data-part-id="${part.id}" class="toggle-fav-btn text-red-500">✕</button></div>`; }).join(''); document.querySelectorAll('#favorites-list .toggle-fav-btn').forEach(b => b.onclick = (e) => toggleFavorite(e.currentTarget.dataset.partId));}
        function renderShoppingList() { const list = document.getElementById('shopping-list-items'); let totalCost = 0; list.innerHTML = !state.shoppingList.length ? `<p class="text-center text-gray-500">${currentLang === 'ar' ? 'قائمة التسوق فارغة.' : 'Shopping list is empty.'}</p>` : state.shoppingList.map(partId => { const part = state.carParts.find(p => p.id === partId); totalCost += part.price; return `<div class="flex justify-between items-center bg-gray-100 dark:bg-gray-700 p-3 rounded-lg"><span>${part.name[currentLang]}</span><div class="flex items-center gap-4"><span>${formatPrice(part.price)}</span><button data-part-id="${part.id}" class="toggle-cart-btn text-red-500">✕</button></div></div>`; }).join(''); document.getElementById('total-cost').textContent = formatPrice(totalCost); document.querySelectorAll('#shopping-list-items .toggle-cart-btn').forEach(b => b.onclick = (e) => toggleCart(e.currentTarget.dataset.partId));}
        function renderMaintenanceLogs() { const list = document.getElementById('maintenance-list'); list.innerHTML = !state.maintenanceLogs.length ? `<p class="text-center text-gray-500">${currentLang === 'ar' ? 'لا توجد سجلات صيانة.' : 'No maintenance logs yet.'}</p>` : [...state.maintenanceLogs].reverse().map(log => `<div class="bg-gray-100 dark:bg-gray-700 p-3 rounded-lg"> <div class="flex justify-between items-center"> <span class="font-bold">${log.type}</span> <span class="text-sm text-gray-500">${new Date(log.date).toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-US')}</span> </div> <p class="text-green-600 dark:text-green-400">${formatPrice(log.cost)}</p> </div>`).join(''); }
        function renderMaintenanceChart() { const ctx = document.getElementById('maintenance-chart')?.getContext('2d'); if (!ctx) return; const sortedLogs = [...state.maintenanceLogs].sort((a, b) => new Date(a.date) - new Date(b.date)); if (maintenanceChart) maintenanceChart.destroy(); maintenanceChart = new Chart(ctx, { type: 'line', data: { labels: sortedLogs.map(l => new Date(l.date).toLocaleDateString(currentLang === 'ar' ? 'ar-SA' : 'en-US')), datasets: [{ label: translations[currentLang].maint_chart_title, data: sortedLogs.map(l => l.cost), borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.2)', fill: true, tension: 0.3 }] }, options: { responsive: true, scales: { y: { beginAtZero: true } } } }); }

        // --- User Actions ---
        function toggleFavorite(partId) { const index = state.favorites.indexOf(partId); if (index > -1) state.favorites.splice(index, 1); else state.favorites.push(partId); saveData(); renderPartsBrowser(document.getElementById('parts-search').value); renderFavorites(); updateListButtons(); }
        function toggleCart(partId) { const index = state.shoppingList.indexOf(partId); if (index > -1) state.shoppingList.splice(index, 1); else state.shoppingList.push(partId); saveData(); renderPartsBrowser(document.getElementById('parts-search').value); renderShoppingList(); updateListButtons(); }
        function handleAddLog(e) { e.preventDefault(); const form = e.target; const newLog = { type: form['log-type'].value, cost: parseFloat(form['log-cost'].value), date: form['log-date'].value, id: Date.now().toString() }; state.maintenanceLogs.push(newLog); saveData(); renderMaintenanceLogs(); updateDashboard(); renderMaintenanceChart(); form.reset(); }

        // --- Animations ---
        function animateDashboardCards() { document.querySelectorAll('.dashboard-card').forEach((card, index) => setTimeout(() => card.classList.add('is-visible'), index * 100)); }

        // --- AI Chat ---
        function setupAIChat() { renderChatHistory(); document.getElementById('chat-form').addEventListener('submit', handleChatSubmit); }
        function renderChatHistory() { const chatMessages = document.getElementById('chat-messages'); if (!chatMessages) return; chatMessages.innerHTML = ''; if (state.chatHistory.length === 0) { chatMessages.innerHTML = `<div class="ai-message p-3 rounded-lg max-w-xs sm:max-w-md">${translations[currentLang].ai_welcome}</div>`; } else { state.chatHistory.forEach(msg => { const messageEl = document.createElement('div'); messageEl.classList.add(msg.role === 'user' ? 'user-message' : 'ai-message', 'p-3', 'rounded-lg', 'max-w-xs', 'sm:max-w-md', msg.role === 'user' ? 'ml-auto' : 'mr-auto'); messageEl.textContent = msg.parts[0].text; chatMessages.appendChild(messageEl); }); } chatMessages.scrollTop = chatMessages.scrollHeight; }
        async function handleChatSubmit(e) { e.preventDefault(); const input = document.getElementById('chat-input'); const userQuery = input.value.trim(); if (!userQuery) return; state.chatHistory.push({ role: 'user', parts: [{ text: userQuery }] }); renderChatHistory(); input.value = ''; const chatMessages = document.getElementById('chat-messages'); const loader = document.createElement('div'); loader.classList.add('ai-message', 'p-3', 'rounded-lg'); loader.innerHTML = `<div class="ai-loader flex items-center gap-2"><span></span><span></span><span></span></div>`; chatMessages.appendChild(loader); chatMessages.scrollTop = chatMessages.scrollHeight; try { const systemInstruction = { role: "system", parts: [{ text: "You are Elias, an expert AI assistant for Changan cars. You are helpful, friendly, and provide concise, accurate information. You must answer in the same language as the user's query (" + currentLang + ")." }] }; const response = await fetch(getGeminiApiUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ systemInstruction: systemInstruction, contents: [...state.chatHistory] }) }); if (!response.ok) throw new Error(`API Error: ${response.status}`); const result = await response.json(); const aiResponse = result.candidates[0].content; state.chatHistory.push(aiResponse); saveData(); renderChatHistory(); } catch (error) { console.error("Gemini Chat failed:", error); state.chatHistory.push({ role: 'model', parts: [{ text: "Sorry, I'm having trouble connecting right now." }] }); renderChatHistory(); } }

        // --- Gemini Daily Tip ---
        async function getEliasDailyTip() {
            const tipContainer = document.getElementById('elias-daily-tip');
            const prompt = `Act as a helpful and friendly car assistant named Elias. Provide a single, concise daily tip for a Changan CS85 owner in ${currentLang === 'ar' ? 'Arabic' : 'English'}. The tip should be practical and easy to understand.`;
            tipContainer.innerHTML = `<div class="gemini-loader flex justify-center items-center gap-2"><span></span><span></span><span></span></div>`;
            try {
                const response = await fetch(getGeminiApiUrl(), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) });
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                const result = await response.json();
                const tipText = result.candidates[0].content.parts[0].text;
                tipContainer.innerHTML = `<p class="font-bold text-lg mb-2">${currentLang === 'ar' ? 'نصيحة إلياس اليومية' : "Elias's Daily Tip"}</p><p>${tipText.replace(/\*/g, '')}</p>`;
            } catch (error) {
                console.error("Gemini API call failed:", error);
                tipContainer.innerHTML = `<p>${currentLang === 'ar' ? 'تعذر تحميل النصيحة اليوم.' : 'Could not load tip today.'}</p>`;
            }
        }
    </script>
</body>
</html>
